<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Egg Factory — Developer Portal</title>
    <style>
      :root {
        --bg: #1c1424;
        --card: #281d33;
        --text: #f0e6f5;
        --muted: #b8a6c4;
        --accent: #ffd257;
        --line: #3f2e52;
      }
      body {
        margin: 0;
        padding: 40px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 36px 32px;
        max-width: 540px;
        width: 100%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        text-align: center;
      }
      h1 {
        color: var(--accent);
        margin: 0 0 12px 0;
        font-size: 26px;
      }
      p {
        color: var(--muted);
        font-size: 15px;
        margin: 0 0 24px 0;
      }
      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 24px;
      }
      .links a {
        display: block;
        padding: 12px 16px;
        background: rgba(255, 210, 87, 0.1);
        color: var(--accent);
        text-decoration: none;
        border: 1px solid var(--accent);
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.2s;
      }
      .links a:hover {
        background: var(--accent);
        color: #1c1424;
      }
      .footer {
        margin-top: 32px;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Egg Factory (gg Factory)</h1>
      <p>Piksel çiftliğini kur, yumurtaları topla ve üretim hattını otomatikleştir.</p>
      <div class="links">
        <a href="privacy-policy.html">Gizlilik Politikası (Privacy Policy)</a>
        <a href="app-ads.txt">app-ads.txt</a>
      </div>
      <div class="footer">
        Geliştirici: ismailgulbag95 &bull; <a href="mailto:ismail.gulbag95@gmail.com" style="color: var(--muted);">İletişim</a>
      </div>
    </div>
  </body>
</html>
